[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preset-inspirer-agent"
version = "0.1.0"
description = "Core LLM logic for generating open-ended inspirational use-case questions."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.0.0"]
playground = ["streamlit>=1.35.0"]
dev = []

[project.scripts]
preset-inspirer = "preset_inspirer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
